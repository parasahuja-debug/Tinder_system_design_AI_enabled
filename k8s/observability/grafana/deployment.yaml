# How Grafana runs — the k8s equivalent of docker-compose.yml's `grafana`
# block. Provisioning (data sources + dashboards) in configmap.yaml, admin
# login in the grafana-secret Secret (template: secret.yaml.example), stable
# address in service.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.3.1 # same pinned version as compose
          envFrom:
            # GF_SECURITY_ADMIN_USER / GF_SECURITY_ADMIN_PASSWORD
            - secretRef:
                name: grafana-secret
          ports:
            - name: http
              containerPort: 3000 # UI, opened via kubectl port-forward
          volumeMounts:
            # Grafana's own working area (its internal SQLite DB of UI-made
            # changes, sessions, plugins). emptyDir: wiped if the pod is
            # replaced — acceptable because everything that matters is
            # re-provisioned from the ConfigMaps below on every start; only
            # hand-made UI tweaks would be lost.
            - name: data
              mountPath: /var/lib/grafana
            # The three provisioning ConfigMaps, each into the directory
            # Grafana expects for that kind of file (see configmap.yaml).
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            # Nested inside the emptyDir above — k8s layers this mount on
            # top, so the dashboard JSON is always present even though the
            # parent directory is scratch space.
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: data
          emptyDir: {}
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboards
          configMap:
            name: grafana-dashboards
