# A stable address for Prometheus: `prometheus:9090` — the same address
# Grafana's datasource already uses under compose, and it still resolves
# because Grafana will live in this same observability namespace.
#
# ClusterIP: internal-only (Prometheus has no login). Its own web UI is
# opened from your machine via `kubectl port-forward svc/prometheus 9090:9090`.
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: observability
spec:
  selector:
    app: prometheus # matches the Deployment's pod label
  ports:
    - name: http
      port: 9090
      targetPort: 9090
