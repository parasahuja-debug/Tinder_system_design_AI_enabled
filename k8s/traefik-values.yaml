# Helm values for the Traefik chart (Phase 6 gateway, replacing nginx).
#
# These three settings exist for one single purpose: landing Traefik on the
# one node we labeled "ingress-ready" in kind-cluster.yaml, and binding it
# directly to that node's network instead of going through an extra Service
# hop — because that node is the one kind already mapped host ports 80/443
# onto. Without all three together, Traefik would get scheduled onto some
# arbitrary node with no path from your Mac's browser/curl into the cluster.
nodeSelector:
  ingress-ready: "true"
tolerations:
  # Kubernetes refuses to schedule ordinary pods onto the control-plane
  # node by default (a "taint") — this is the matching "toleration" that
  # says Traefik is explicitly allowed there anyway.
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
# hostNetwork: true makes Traefik's pod share the node's own network stack
# directly (bind to the node's real 80/443) rather than getting its own
# pod-private IP that something else would need to route to — this is what
# actually connects to kind's extraPortMappings.
hostNetwork: true
service:
  # With hostNetwork already doing the job of exposing Traefik, a separate
  # Service of type LoadBalancer/NodePort would be redundant plumbing —
  # ClusterIP (internal-only) is enough since nothing outside the cluster
  # reaches Traefik through this Service anyway.
  type: ClusterIP
# 2026-10-28: removed — this is one of two equally valid fixes for the
# same mismatch (kind's extraPortMappings expecting 80/443, Traefik
# defaulting to 8000/8443 internally). Confirmed both directions work;
# we're keeping the OTHER fix instead (kind-cluster.yaml's containerPort
# now matches Traefik's real defaults, 8000/8443, rather than moving
# Traefik to 80/443). Kept for history per standing rule:
# ports:
#   web:
#     port: 80
#   websecure:
#     port: 443
# The chart's default update strategy tries to start a NEW pod (surge)
# before killing the old one, for zero-downtime rollouts. That can never
# work here: with hostNetwork binding directly to the one ingress-ready
# node's ports 80/443, a second pod can't start until the first one's gone
# — there's nowhere else for it to run. Recreate (kill old, then start new)
# is the correct strategy for this specific constraint, not a workaround.
updateStrategy:
  type: Recreate
