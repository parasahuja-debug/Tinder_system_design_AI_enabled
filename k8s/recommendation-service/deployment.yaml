apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendation-service
  namespace: tinder
spec:
  replicas: 1
  selector:
    matchLabels:
      app: recommendation-service
  template:
    metadata:
      labels:
        app: recommendation-service
    spec:
      containers:
        - name: recommendation-service
          image: tinder-recommendation-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8005
          envFrom:
            - configMapRef:
                name: recommendation-service-config
          readinessProbe:
            httpGet:
              path: /metrics
              port: 8005
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /metrics
              port: 8005
            initialDelaySeconds: 10
