# External door for recommendation-service — Gateway API equivalent of
# nginx's protected `location /discover` (the Discover page's candidate
# feed). GUARDED route; same shape and reasoning as
# k8s/profile-service/httproute.yaml (read that one for the full comments).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: recommendation-service
  namespace: tinder
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: web
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /discover
      filters:
        # Traefik-specific auth guard (cloud-portability swap point).
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: forward-auth
      backendRefs:
        - name: recommendation-service
          port: 8005
