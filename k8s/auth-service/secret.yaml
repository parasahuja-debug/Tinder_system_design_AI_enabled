# JWT_SECRET specifically, kept out of the ConfigMap — a Secret isn't
# meaningfully more protected by default in a dev kind cluster (it's just
# base64, not encrypted, unless the cluster has encryption-at-rest
# configured), but it IS the correct resource type to reach for real
# secrets management later: this is the one object that would get swapped
# for an External Secrets Operator pulling from AWS Secrets Manager/Azure
# Key Vault/GCP Secret Manager on a real cloud move, without touching the
# Deployment that references it.
apiVersion: v1
kind: Secret
metadata:
  name: auth-service-secret
  namespace: tinder
type: Opaque
stringData:
  JWT_SECRET: "dev-secret-change-me" # dev only; same value/caveat as docker-compose.yml today
