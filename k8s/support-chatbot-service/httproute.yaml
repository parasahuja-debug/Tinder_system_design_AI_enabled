# External door for the support chatbot WebSocket — Gateway API equivalent
# of nginx's `location /support/ws`. Self-authenticated like /chat/ws (token
# in Sec-WebSocket-Protocol, checked by the service against auth-service), so
# no forward-auth guard; Traefik passes the WS upgrade through natively.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: support-chatbot-service
  namespace: tinder
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: web
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /support/ws
      filters:
        # Unguarded door: strip any client-sent identity header.
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove:
              - X-User-Id
      backendRefs:
        - name: support-chatbot-service
          port: 8008
