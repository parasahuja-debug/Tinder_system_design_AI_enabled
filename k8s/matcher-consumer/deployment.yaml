# Has a real /health route, but — per matcher_consumer/CLAUDE.md — that
# route does NOT reflect the actual background Kafka-consumer thread's
# health, only whether the FastAPI app itself is up. Worth knowing as a
# real limitation of this probe, not something to silently assume covers
# more than it does.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matcher-consumer
  namespace: tinder
spec:
  # 2026-11-13: replaced — 2 replicas to actually exercise Phase 1's
  # partitioned design: both consumers join consumer group
  # matcher-consumer-group, Redpanda splits the `swipes` topic's 6
  # partitions between them (3 each), and because each swipe's partition
  # key is the sorted user pair, both halves of a potential match always
  # land on the same partition -> the same consumer, so no race between
  # replicas. Fixed (not autoscaled): more than 6 consumers would sit idle,
  # since a partition is never shared within a group.
  # replicas: 1
  replicas: 2
  selector:
    matchLabels:
      app: matcher-consumer
  template:
    metadata:
      labels:
        app: matcher-consumer
      # Prometheus opt-in markers — same as auth-service's deployment.yaml.
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8009"
    spec:
      containers:
        - name: matcher-consumer
          image: tinder-matcher-consumer:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8009
          envFrom:
            - configMapRef:
                name: matcher-consumer-config
          readinessProbe:
            httpGet:
              path: /health
              port: 8009
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8009
            initialDelaySeconds: 10
