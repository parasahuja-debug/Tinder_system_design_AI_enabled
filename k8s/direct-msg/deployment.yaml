apiVersion: apps/v1
kind: Deployment
metadata:
  name: direct-msg
  namespace: tinder
spec:
  # 2026-11-13: replaced — replica count is now owned by the KEDA
  # ScaledObject (k8s/direct-msg/scaledobject.yaml: min 2, max 4, driven by
  # this service's Prometheus request rate). Leaving a fixed `replicas` here
  # would make every `kubectl apply` of this file fight the autoscaler.
  # 2+ replicas is safe because chat delivery fans out via Redis Pub/Sub
  # (each replica subscribes to chat:<user_id> for its own sockets), not an
  # in-process dict.
  # replicas: 1
  selector:
    matchLabels:
      app: direct-msg
  template:
    metadata:
      labels:
        app: direct-msg
      # Prometheus opt-in markers — same as auth-service's deployment.yaml.
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8007"
    spec:
      containers:
        - name: direct-msg
          image: tinder-direct-msg:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8007
          envFrom:
            - configMapRef:
                name: direct-msg-config
          readinessProbe:
            httpGet:
              path: /health
              port: 8007
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8007
            initialDelaySeconds: 10
