# External doors for direct-msg — Gateway API equivalent of nginx's
# `location /chat/history` (guarded) and `location /chat/ws` (self-
# authenticated). Two rules in one route because they share a backend but
# need different treatment at the gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: direct-msg
  namespace: tinder
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: web
  rules:
    # Chat history for one match, fetched when the Chat page loads. GUARDED;
    # same shape as k8s/profile-service/httproute.yaml.
    - matches:
        - path:
            type: PathPrefix
            value: /chat/history
      filters:
        # Traefik-specific auth guard (cloud-portability swap point).
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: forward-auth
      backendRefs:
        - name: direct-msg
          port: 8007

    # Live chat WebSocket. Deliberately UNGUARDED at the gateway: a browser
    # can't set an Authorization header on a WebSocket handshake, so
    # direct-msg checks the token itself (carried in Sec-WebSocket-Protocol —
    # see direct_msg/main.py). Unlike nginx, no Upgrade/Connection header
    # config is needed: Traefik passes WebSocket upgrades through natively.
    - matches:
        - path:
            type: PathPrefix
            value: /chat/ws
      filters:
        # No guard here to overwrite a forged X-User-Id, so strip it — same
        # reasoning as k8s/auth-service/httproute.yaml. Core Gateway API.
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove:
              - X-User-Id
      backendRefs:
        - name: direct-msg
          port: 8007
