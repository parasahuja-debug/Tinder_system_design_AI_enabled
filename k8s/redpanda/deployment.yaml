# Deployment, not StatefulSet — same reasoning as redis/deployment.yaml:
# docker-compose.yml's redpanda has no volumes: entry either, so there's
# no real persisted state to protect here in this dev build.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redpanda
  namespace: tinder
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redpanda
  template:
    metadata:
      labels:
        app: redpanda
    spec:
      containers:
        - name: redpanda
          image: redpandadata/redpanda:v24.2.10
          # Same single-node dev-mode flags docker-compose.yml already
          # uses — advertise-kafka-addr uses "redpanda", matching this
          # Deployment's own Service name (next piece), same as every
          # other service's internal DNS name already does.
          #
          # args, not command: this image has its own /entrypoint.sh,
          # which does real setup work before launching the redpanda
          # binary. docker-compose's `command:` field only overrides CMD
          # and leaves ENTRYPOINT alone — Kubernetes' `command:` field
          # overrides ENTRYPOINT itself, which would skip that script
          # entirely and run the raw binary directly (exactly what broke
          # just now: "unrecognised option" from the raw binary rejecting
          # a flag format the entrypoint script normally handles). `args`
          # is Kubernetes' equivalent of compose's `command:` — it leaves
          # ENTRYPOINT in place and just hands it these as arguments.
          args:
            - redpanda
            - start
            - --smp=1
            - --memory=512M
            - --overprovisioned
            - --node-id=0
            - --kafka-addr=PLAINTEXT://0.0.0.0:9092
            - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
          ports:
            - containerPort: 9092
          readinessProbe:
            # Same health check docker-compose's healthcheck already uses.
            exec:
              command: ["sh", "-c", "rpk cluster health | grep -q 'Healthy:.*true'"]
            initialDelaySeconds: 10
            periodSeconds: 5
            # 2026-11-13: added — the default 1s timeout was routinely exceeded
            # by `rpk cluster health` when the cluster was CPU-busy. Readiness
            # failing only pauses traffic (never restarts), so a generous
            # timeout is safe here.
            timeoutSeconds: 10
          # 2026-11-13: replaced — this liveness check (same rpk command, 1s
          # default timeout, 3 failures) killed Redpanda 5 times under CPU
          # load, and because Redpanda has no persistent storage, every
          # restart wiped the swipes/matches topics and silently stopped
          # async matching. Liveness should only catch a truly hung process,
          # so it's now a cheap "is the Kafka port accepting connections"
          # check with a ~2 minute tolerance; the full cluster-health query
          # stays on readiness above. (The real cure for the data loss is
          # persistent storage — tracked separately.)
          # livenessProbe:
          #   exec:
          #     command: ["sh", "-c", "rpk cluster health | grep -q 'Healthy:.*true'"]
          #   initialDelaySeconds: 15
          #   periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
