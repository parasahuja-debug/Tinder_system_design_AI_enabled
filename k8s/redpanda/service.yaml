# Same shape as every other Service file. Named "redpanda" to match
# matcher_service/matcher_consumer's existing broker address
# (redpanda:9092).
apiVersion: v1
kind: Service
metadata:
  name: redpanda
  namespace: tinder
spec:
  selector:
    app: redpanda
  ports:
    - name: kafka
      port: 9092
      targetPort: 9092
    # 2026-10-30: added — redpanda's admin HTTP API, used by `rpk cluster
    # health` (a different subsystem/port than the Kafka protocol port
    # above). Only became apparent when the init job's wait-loop, run from
    # a genuinely different pod, failed to reach it — this port was never
    # declared here, so nothing outside this pod could route to it via
    # the Service even though redpanda itself was listening on it fine.
    - name: admin
      port: 9644
      targetPort: 9644
