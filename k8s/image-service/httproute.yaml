# External door for image-service — Gateway API equivalent of nginx's
# protected `location /images`. GUARDED route; same shape and reasoning as
# k8s/profile-service/httproute.yaml (read that one for the full comments).
#
# Covers POST /images (upload), GET /images (list) and GET /images/<id>
# (redirect to CloudFront) — all under one prefix, path passed unchanged.
# No body-size setting needed: nginx needed client_max_body_size 5m to lift
# its own 1MB default, but Traefik has no default request-body cap, so
# image_service's own 5MB check is the only limit.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: image-service
  namespace: tinder
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: web
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /images
      filters:
        # Traefik-specific auth guard (cloud-portability swap point).
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: forward-auth
      backendRefs:
        - name: image-service
          port: 8003
