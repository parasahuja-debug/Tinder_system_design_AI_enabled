# Auto-registers Prometheus as a Grafana datasource on container startup —
# same internal compose hostname every other service uses to reach one
# another (prometheus:9090), not localhost:9090 (that's only how the HOST
# reaches it, via the port mapping in docker-compose.yml).
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy # Grafana's backend calls Prometheus server-side, not the browser directly
    url: http://prometheus:9090
    isDefault: true
  # Phase 5: Tempo as a second datasource — same auto-provisioning as
  # Prometheus above, so traces show up inside this same Grafana instead of
  # needing a separate tool to view. type: tempo is Grafana's built-in
  # Tempo datasource plugin (not the generic "http" type) — it's what
  # renders trace waterfalls/search in the UI, not just raw JSON.
  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
