# One compose file brings up the whole local system. Service names here double
# as DNS hostnames on the compose network, so they must match what nginx already
# expects (auth-service:8002, profile-service:8001).

services:
  # Single shared Postgres for every service. pgvector image (not stock
  # postgres) is chosen now so Day 5's chatbot can `CREATE EXTENSION vector`
  # without a late image swap. One DB, one table set per service.
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tinder # dedicated DB for this project; the image creates it on first init
    ports:
      - "5432:5432" # exposed to host so the Postgres MCP server / psql can inspect it
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Services wait on this so they don't race the DB and crash on startup.
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Issues/verifies JWTs; owns the users table. Only service with JWT_SECRET.
  auth-service:
    build: ./auth_service
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/tinder
      JWT_SECRET: dev-secret-change-me # dev only; a real deploy injects a real secret
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8002" # reachable only inside the compose network, never from the host

  # Profile data; trusts the gateway's X-User-Id header, never sees the token.
  profile-service:
    build: ./profile_service
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/tinder
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8001"

  # Owns uploaded images: real AWS S3 + CloudFront as of Phase 4 of the
  # production-scale plan (see image_service/main.py's module docstring) —
  # a Postgres row per image still, but the bytes themselves live in S3, not
  # on local disk. Trusts the gateway's X-User-Id header, same as
  # profile-service. AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY/AWS_REGION/
  # S3_BUCKET_NAME/CLOUDFRONT_DOMAIN come from the root .env file (see
  # scripts/setup-aws-phase4.sh) via compose's automatic ${VAR} substitution
  # — same mechanism already used for support-chatbot-service's LANGSMITH_*
  # vars below.
  image-service:
    build: ./image_service
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/tinder
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      CLOUDFRONT_DOMAIN: ${CLOUDFRONT_DOMAIN}
      # 2026-08-21 (Phase 4): replaced — local disk storage is gone. Kept
      # for history per standing rule:
      # IMAGE_STORE_DIR: /app/image_store
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8003"
    # 2026-08-21 (Phase 4): replaced — no local disk storage to bind-mount
    # anymore. Kept for history per standing rule:
    # volumes:
    #   # Bind mount (not an anonymous volume): ties the container path to a
    #   # real folder in the repo, so uploaded files are visible on the host at
    #   # ./image_store/ and survive `docker compose down` — needed to actually
    #   # verify "file on disk matches DB row" from outside the container.
    #   - ./image_store:/app/image_store

  # Swipe decisions. Trusts the gateway's X-User-Id header, same as
  # profile-service/image-service. Owns the swipes/matches tables (though as
  # of Phase 1, matcher-consumer below is the one that writes matches — see
  # matcher_service/main.py's record_swipe docstring). depends_on redpanda
  # now too: every swipe publishes an event there.
  matcher-service:
    build: ./matcher_service
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/tinder
    depends_on:
      db:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    expose:
      - "8004"

  # Consumes the swipes topic and decides matches — see
  # matcher_consumer/main.py's module docstring and CLAUDE.md for the full
  # reasoning (Phase 1 of the production-scale plan). Not in gateway's
  # routes: nothing calls this over HTTP except Prometheus scraping /metrics.
  matcher-consumer:
    build: ./matcher_consumer
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/tinder
    depends_on:
      db:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
    expose:
      - "8009"

  # Candidate-feed queries for Discover. Read-only: reads profiles/swipes/
  # images directly from the shared DB (see recommendation_service/main.py's
  # module docstring) rather than calling those services over HTTP, so it
  # only needs the DB itself, not the other services, to be up.
  recommendation-service:
    build: ./recommendation_service
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/tinder
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8005"

  # Presence registry: tracks which users have a live chat WebSocket open
  # right now. Backed by Redis, not in-memory, as of Phase 2 of the
  # production-scale plan — see session_service/main.py's module docstring
  # for the full reasoning. Not in gateway's routes: only direct-msg ever
  # calls it, service-to-service.
  session-service:
    build: ./session_service
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "8006"

  # WebSocket chat between two matched users + persisted message history.
  # Calls auth-service, matcher-service, and session-service directly over
  # this network (see main.py's module docstring) rather than only reading
  # the shared DB, which is why it needs depends_on the others, not just db.
  # Also depends on redis (Phase 2): chat delivery fans out via Pub/Sub so
  # messages cross replica boundaries — see main.py's module-level Redis
  # comment. 2026-08-21 (Phase 3): no more DATABASE_URL/Postgres dependency
  # at all — messages moved to Cassandra, which was this service's only
  # table, so its Postgres connection is gone entirely. See main.py's
  # module docstring for the schema/reasoning.
  direct-msg:
    build: ./direct_msg
    environment:
      AUTH_SERVICE_URL: http://auth-service:8002
      MATCHER_SERVICE_URL: http://matcher-service:8004
      SESSION_SERVICE_URL: http://session-service:8006
      REDIS_URL: redis://redis:6379/0
      CASSANDRA_HOSTS: cassandra
    depends_on:
      auth-service:
        condition: service_started
      matcher-service:
        condition: service_started
      session-service:
        condition: service_started
      redis:
        condition: service_healthy
      cassandra:
        condition: service_healthy
    expose:
      - "8007"

  # Local model server for the support chatbot — both the visible chat and
  # mem0's own summarization run on a model pulled here, not the Claude API
  # (see support_chatbot_service/CLAUDE.md for the reasoning: a high-
  # frequency, low-stakes workload like this doesn't need to spend Claude
  # tokens). Sealed inside the compose network like every backend service —
  # never exposed to the host or the gateway.
  #
  # Bind-mounted to the HOST's own Ollama data dir (~/.ollama), not a fresh
  # named volume: discovered during Day 5 verification that pulling a new
  # model from inside the container meant a slow multi-GB download the host
  # already had sitting on disk from prior Ollama use outside this project.
  # Sharing the directory means this container sees whatever's already
  # pulled (llama3.2, nomic-embed-text, ...) with zero new downloads. A
  # pragmatic, dev-only choice — two Ollama processes (host + container)
  # reading/writing the same directory concurrently would be a real risk in
  # anything other than a single-developer local setup, but here it's the
  # same person's own machine either way.
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ${HOME}/.ollama:/root/.ollama
    expose:
      - "11434"

  # RAG + memory support chatbot — the one service that calls a model at
  # runtime. See support_chatbot_service/CLAUDE.md for the full
  # architecture (both widget modes, the two-layer memory, the MCP-guarded
  # live-data tools). README.md is bind-mounted read-only so it always
  # embeds whatever the file currently says, no rebuild needed.
  support-chatbot-service:
    build: ./support_chatbot_service
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/tinder
      AUTH_SERVICE_URL: http://auth-service:8002
      OLLAMA_HOST: http://ollama:11434
      # Model names come from .env, not hardcoded here — lets you retune
      # which model does what (see support_chatbot_service/config.py) with
      # just an .env edit + `docker compose up -d support-chatbot-service`,
      # no code change or rebuild. Defaults (after the :-) match config.py's
      # own Python-level fallbacks, kept in sync manually since compose has
      # no way to read another file's defaults.
      CHAT_MODEL: ${CHAT_MODEL:-llama3.2}
      MEM0_LLM_MODEL: ${MEM0_LLM_MODEL:-mistral:7b-instruct-v0.3-q4_K_M}
      MEM0_EMBED_MODEL: ${MEM0_EMBED_MODEL:-nomic-embed-text}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT}
    depends_on:
      db:
        condition: service_healthy
      auth-service:
        condition: service_started
      ollama:
        condition: service_started
    expose:
      - "8008"
    volumes:
      - ./README.md:/app/README.md:ro

  # Event broker for swipe routing (see matcher_service/main.py and the new
  # matcher-consumer service for the full reasoning). Redpanda, not upstream
  # Kafka: same wire protocol and client libraries, but a single binary with
  # no separate ZooKeeper process to run — matters on a laptop. `rpk` below
  # is Redpanda's own CLI, bundled in the image, used once at startup (see
  # the `command`) to create the swipes topic with a fixed partition count.
  redpanda:
    image: redpandadata/redpanda:v24.2.10
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
    expose:
      - "9092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot job, not a long-running service: creates both topics this system
  # uses, then exits. `swipes` gets 6 partitions (see matcher_service/main.py's
  # docstring for why the partition count/key matter for consistent-hash
  # routing); `matches` gets fewer (3) since match creation is inherently
  # lower-volume than raw swipes (most swipes are one-directional, only a
  # fraction become mutual). Separate from the redpanda container itself
  # because rpk needs the broker already accepting connections first — this
  # runs after redpanda's healthcheck passes, then `restart: "no"` means it
  # never re-runs on subsequent `docker compose up`s (topics already exist).
  redpanda-init:
    image: redpandadata/redpanda:v24.2.10
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "rpk topic create swipes --partitions 6 --replicas 1 --brokers redpanda:9092 || true; rpk topic create matches --partitions 3 --replicas 1 --brokers redpanda:9092 || true"
    restart: "no"

  # Shared in-memory store for session_service (presence keys) and
  # direct_msg (Pub/Sub chat fan-out across replicas) — see each service's
  # own comments for the full reasoning (Phase 2 of the production-scale
  # plan). No persistence configured: both use cases here are fine to lose
  # on a restart (presence re-registers, chat history lives in Postgres/
  # Cassandra, not Redis).
  redis:
    image: redis:7.4-alpine
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Chat message storage (Phase 3 of the production-scale plan), replacing
  # direct_msg's Postgres `messages` table — see direct_msg/main.py's module
  # docstring for the schema/reasoning. Single-node dev cluster: real
  # replication needs multiple nodes, same "not possible on one laptop
  # container" caveat as redpanda's replicas=1. Healthcheck uses cqlsh
  # (bundled in the image) since Cassandra's JVM startup is noticeably
  # slower than Postgres's — services depending on it need to wait for it
  # to actually be ready to accept CQL connections, not just for the
  # container process to exist.
  cassandra:
    image: cassandra:4.1
    # On both networks: "default" is how every other service (direct-msg,
    # etc.) still reaches it by DNS name, same as always; cassandra_net is
    # where it gets the fixed IP cassandra-web needs (see that network's
    # top-level comment).
    networks:
      default: {}
      cassandra_net:
        ipv4_address: 172.28.0.10
    volumes:
      # Named volume, same reasoning as Postgres's pgdata below — without
      # this, Cassandra's data directory is just the container's own
      # writable layer, wiped on every recreate (not just restart). Real
      # bug found during Phase 3 verification: recreating this container
      # to attach the static-IP network (above) silently lost all message
      # data because this volume didn't exist yet at that point.
      - cassandra_data:/var/lib/cassandra
    expose:
      - "9042"
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s

  # Dev-only browser UI for Cassandra — same purpose/pattern as pgweb below
  # for Postgres, not part of the app itself. Lets you browse keyspaces/
  # tables/rows without going through cqlsh by hand.
  cassandra-web:
    image: metavige/cassandra-web:latest
    # Only needs to reach cassandra, and only by the fixed IP (its startup
    # script rejects a DNS hostname here — see the cassandra_net top-level
    # comment) — so this is the one service in the whole file that doesn't
    # also need the default network.
    networks:
      - cassandra_net
    environment:
      CASSANDRA_HOST: 172.28.0.10
      # Our Cassandra container has no authentication enabled at all (the
      # default AllowAllAuthenticator) — these credentials are ignored
      # server-side, but cassandra-web's own startup script unconditionally
      # passes --username/--password and errors out on an empty value, so
      # something has to be set regardless. "cassandra"/"cassandra" is the
      # image's own conventional default superuser pair.
      CASSANDRA_USER: cassandra
      CASSANDRA_PASSWORD: cassandra
    ports:
      - "3001:3000"
    depends_on:
      cassandra:
        condition: service_healthy

  # Postgres itself doesn't speak Prometheus's format — this sidecar queries
  # it directly (pg_database_size, connection counts, etc.) and re-exposes
  # the results as a normal /metrics endpoint, so it can be scraped exactly
  # like every other service instead of needing a special case.
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      DATA_SOURCE_NAME: postgresql://postgres:postgres@db:5432/tinder?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "9187"

  # Scrapes /metrics off every instrumented service on a timer (see
  # observability/prometheus.yml for the target list + why static_configs is
  # the right tool for now). No depends_on: a scrape failing because a target
  # isn't up yet just gets retried on the next interval, so there's nothing to
  # wait on. Exposed to the host (9090) purely as a dev convenience, same
  # reasoning as pgweb below — not something a real client ever reaches.
  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  # Dashboards on top of Prometheus. Datasource + dashboard-provider configs
  # come from provisioning/ (auto-loaded on startup, see the files' own
  # comments); the actual dashboard JSON is mounted separately at the path
  # dashboards.yml's provider points to. Dev-only admin credentials — same
  # spirit as JWT_SECRET's "dev only" comment elsewhere in this file.
  grafana:
    image: grafana/grafana:11.3.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  # nginx: the only thing clients talk to. Routes + gates protected routes via
  # auth_request. Config is mounted (not baked) so edits don't need a rebuild.
  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./gateway/conf.d:/etc/nginx/conf.d:ro
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - profile-service
      - image-service
      - matcher-service
      - recommendation-service
      - direct-msg
      - support-chatbot-service

  # Dev-only browser UI for the DB (the "Studio-like" page). It speaks HTTP to
  # you on 8081 and the Postgres wire protocol to `db` internally — which is why
  # you can't just point a browser at 5432. sslmode=disable because our local
  # Postgres has no TLS. Not part of the app; purely for inspecting tables/rows.
  pgweb:
    image: sosedoff/pgweb:latest
    environment:
      PGWEB_DATABASE_URL: postgresql://postgres:postgres@db:5432/tinder?sslmode=disable
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: # named volume so DB data survives `docker compose down`
  cassandra_data: # named volume so Cassandra data survives container recreation, same reasoning as pgdata

networks:
  # Every service is on the implicit "default" network unless it says
  # otherwise (DNS-name-based lookup, e.g. "cassandra:9042" from direct-msg
  # — this is how every other service already reaches each other). This
  # custom network exists for exactly one reason: cassandra-web's own
  # startup script needs a literal IP address for Cassandra, not a DNS
  # name (see cassandra-web's own comment) — a fixed subnet lets cassandra
  # get a static IP that survives container recreation, instead of hand-
  # updating an IP every time cassandra gets rebuilt.
  cassandra_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
