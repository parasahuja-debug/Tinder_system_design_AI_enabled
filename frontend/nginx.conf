# nginx config for serving the built Angular app inside its container.
# (Not the old API gateway — routing between frontend and backend services
# is Traefik's job now; this only serves static files.)
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: Angular owns routes like /discover or /matches on the
    # client. A real file is served if it exists; otherwise index.html, and
    # the Angular router takes it from there. Without this, refreshing the
    # browser on /discover would 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Liveness/readiness target for the k8s probes — cheap, no file I/O.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
