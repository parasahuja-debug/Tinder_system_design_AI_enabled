# link multiple servers to one process.
# upstream bananas {
#     server 10.0.0.1:8001;
# }
# location /profile {
#     proxy_pass http://bananas;
# }

server {
    listen 8080;                          # Gateway port

    # Internal auth validation endpoint
    location = /auth/validate { #= is exact match
        internal;                         # Cannot be accessed externally

        proxy_pass http://auth-service:8002/validate;  # Call auth service

        proxy_pass_request_body off;      # No body needed
        proxy_set_header Content-Length "";

        proxy_set_header Authorization $http_authorization; # Forward token
    }

    # 👤 Protected route
    location /profile {
        auth_request /auth/validate;      # Call auth before request

        # Capture the X-User-Id that /validate returned on the auth subrequest.
        # auth_request_set must live in the same location as auth_request — this
        # is where nginx makes the subrequest's response headers available as
        # $upstream_http_*. Without this line the id is computed and thrown away.
        auth_request_set $user_id $upstream_http_x_user_id;

        proxy_pass http://profile-service:8001; # Forward request

        proxy_set_header Authorization $http_authorization;

        # Hand the authenticated id to the upstream. This is the whole point of
        # the model: profile_service trusts X-User-Id and never sees the token,
        # because only the gateway can reach it and only the gateway set this.
        proxy_set_header X-User-Id $user_id;
    }

    # 🔓 Public auth routes
    location /auth {
        proxy_pass http://auth-service:8002;
    }

    # 🖼️ Protected route — image upload/list/serve, all under one prefix
    # (POST /images, GET /images, GET /images/<id> all reach image-service
    # with the path unchanged, since proxy_pass has no trailing path here).
    location /images {
        auth_request /auth/validate;
        auth_request_set $user_id $upstream_http_x_user_id;

        # nginx's own default body-size cap (1MB) applies before the request
        # ever reaches image-service — raised here to match image_service's
        # own MAX_FILE_SIZE_BYTES (5MB), otherwise a >1MB upload would be
        # rejected by nginx before image_service's own check ever runs.
        client_max_body_size 5m;

        proxy_pass http://image-service:8003;

        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-User-Id $user_id;
    }

    # 🔎 Protected route — candidate feed for the Discover swipe deck.
    location /discover {
        auth_request /auth/validate;
        auth_request_set $user_id $upstream_http_x_user_id;

        proxy_pass http://recommendation-service:8005;

        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-User-Id $user_id;
    }

    # 👍 Protected route — record a swipe decision.
    location /swipe {
        auth_request /auth/validate;
        auth_request_set $user_id $upstream_http_x_user_id;

        proxy_pass http://matcher-service:8004;

        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-User-Id $user_id;
    }

    # 💞 Protected route — list the caller's matches. Same upstream as
    # /swipe above (matcher-service owns both paths), just a different
    # location block since the paths themselves differ.
    location /matches {
        auth_request /auth/validate;
        auth_request_set $user_id $upstream_http_x_user_id;

        proxy_pass http://matcher-service:8004;

        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-User-Id $user_id;
    }

    # 💬 Self-authenticated route — live chat WebSocket. Deliberately skips
    # auth_request: a WS upgrade doesn't compose with nginx's subrequest-based
    # auth_request mechanism, and a browser can't set Authorization on a WS
    # handshake anyway. direct-msg authenticates the connection itself (see
    # direct_msg/main.py's module docstring) via a token carried in the
    # Sec-WebSocket-Protocol header, which nginx forwards through untouched
    # like any other header — no special directive needed for that part.
    # proxy_http_version + the Upgrade/Connection headers below are what turn
    # this from a normal proxied request into a passthrough for the WS
    # upgrade handshake itself.
    location /chat/ws {
        proxy_pass http://direct-msg:8007;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 💬 Protected route — chat history for one match, fetched once when the
    # Chat page loads, before the WebSocket above connects. Ordinary
    # auth_request pattern, same shape as /matches.
    location /chat/history {
        auth_request /auth/validate;
        auth_request_set $user_id $upstream_http_x_user_id;

        proxy_pass http://direct-msg:8007;

        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-User-Id $user_id;
    }

    # 🤖 Self-authenticated route — support chatbot WebSocket. Same reasoning
    # as /chat/ws above: auth_request can't gate a WS upgrade, so
    # support-chatbot-service authenticates the connection itself (see
    # support_chatbot_service/main.py's support_chat docstring) via the same
    # Sec-WebSocket-Protocol token trick. No separate history route here,
    # unlike /chat/history — this service never re-fetches a past session
    # (plan decision #7), so there's nothing for the widget to GET on load.
    location /support/ws {
        proxy_pass http://support-chatbot-service:8008;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}