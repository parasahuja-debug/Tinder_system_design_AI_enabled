# link multiple servers to one process.
# upstream bananas {
#     server 10.0.0.1:8001;
# }
# location /profile {
#     proxy_pass http://bananas;
# }

server {
    listen 8080;                          # Gateway port

    # Internal auth validation endpoint
    location = /auth/validate { #= is exact match
        internal;                         # Cannot be accessed externally

        proxy_pass http://auth-service:8002/validate;  # Call auth service

        proxy_pass_request_body off;      # No body needed
        proxy_set_header Content-Length "";

        proxy_set_header Authorization $http_authorization; # Forward token
    }

    # 👤 Protected route
    location /profile {
        auth_request /auth/validate;      # Call auth before request

        # Capture the X-User-Id that /validate returned on the auth subrequest.
        # auth_request_set must live in the same location as auth_request — this
        # is where nginx makes the subrequest's response headers available as
        # $upstream_http_*. Without this line the id is computed and thrown away.
        auth_request_set $user_id $upstream_http_x_user_id;

        proxy_pass http://profile-service:8001; # Forward request

        proxy_set_header Authorization $http_authorization;

        # Hand the authenticated id to the upstream. This is the whole point of
        # the model: profile_service trusts X-User-Id and never sees the token,
        # because only the gateway can reach it and only the gateway set this.
        proxy_set_header X-User-Id $user_id;
    }

    # 🔓 Public auth routes
    location /auth {
        proxy_pass http://auth-service:8002;
    }

    # 🖼️ Protected route — image upload/list/serve, all under one prefix
    # (POST /images, GET /images, GET /images/<id> all reach image-service
    # with the path unchanged, since proxy_pass has no trailing path here).
    location /images {
        auth_request /auth/validate;
        auth_request_set $user_id $upstream_http_x_user_id;

        # nginx's own default body-size cap (1MB) applies before the request
        # ever reaches image-service — raised here to match image_service's
        # own MAX_FILE_SIZE_BYTES (5MB), otherwise a >1MB upload would be
        # rejected by nginx before image_service's own check ever runs.
        client_max_body_size 5m;

        proxy_pass http://image-service:8003;

        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-User-Id $user_id;
    }
}